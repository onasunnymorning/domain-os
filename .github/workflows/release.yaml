name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: domain-os
            context: .
            file: ./Dockerfile
          - name: unified-worker
            context: .
            file: ./cmd/workers/unified/Dockerfile
          - name: epp-server
            context: .
            file: ./Dockerfile.epp
          - name: whois
            context: .
            file: ./cmd/whois/Dockerfile
          - name: mcp-server
            context: .
            file: ./Dockerfile.mcp
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            geapex/${{ matrix.image.name }}:${{ steps.version.outputs.version }}
            geapex/${{ matrix.image.name }}:${{ github.sha }}
            geapex/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Generate changelog for this release
        run: |
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest
          git-chglog ${{ github.ref_name }} > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
