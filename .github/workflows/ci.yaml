name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --issues-exit-code=0

  envcheck:
    name: Env Var Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - name: Check env var registry
        run: go test -run 'TestEnvRegistryDrift|TestRegistryNoDuplicates|TestRegistryHasDescriptions' ./internal/config/...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup and Cache Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
        id: go

      - name: Start test Database server
        run: |
          chmod +x .github/scripts/setup-test-db.sh
          .github/scripts/setup-test-db.sh testdb

      - name: Go Vulnerability Check
        # govulncheck v1.4.0 (latest) panics on Go 1.26 due to an x/tools
        # bug in ForEachElement with *types.TypeParam. Non-blocking until
        # upstream ships a fix. Trivy image scan provides backup coverage.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run All Tests
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1


      - name: Coverage Summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "## 🧪 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ No coverage report — tests may have failed before generating output." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $NF}')
          echo "## 🧪 Unit Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: ${TOTAL}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | grep -E 'controller\.go|service\.go|total:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "UNIT_COVERAGE=${TOTAL}" >> $GITHUB_ENV

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Run Registrar Tests
        run: |
          cd frontend
          echo "Running registrar management tests..."
          npm test -- registrars

      - name: Generate Frontend Coverage Report
        run: |
          cd frontend
          npm run test:coverage

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

  build-images:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests, lint]
    strategy:
      matrix:
        image:
          - name: domain-os
            context: .
            file: ./Dockerfile
          - name: unified-worker
            context: .
            file: ./cmd/workers/unified/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Determine platforms: multi-platform on main, amd64-only on PRs for speed
      - name: Set platforms
        id: platforms
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - name: Read version and build date
        id: version
        run: |
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          tags: geapex/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  security-scan:
    name: Trivy Image Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build-images]
    strategy:
      matrix:
        image:
          - domain-os
          - unified-worker
    steps:
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: geapex/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH


  api-tests:
    name: API integration tests (Go-native)
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    services:
      postgres:
        image: postgres:16.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: unittest
          POSTGRES_DB: dos_integration_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Run API Integration Tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: postgres
          TEST_DB_PASS: unittest
          TEST_DB_NAME: dos_integration_tests
          TEST_DB_SSLMODE: disable
        run: |
          go test -count=1 -v \
            -coverprofile=api-coverage.out \
            -coverpkg=./internal/interface/rest/...,./internal/application/...,./pkg/domain/... \
            ./internal/interface/rest/tests/...

      - name: API Coverage Summary
        if: always()
        run: |
          if [ -f api-coverage.out ]; then
            TOTAL=$(go tool cover -func=api-coverage.out | grep total | awk '{print $NF}')
            echo "## 🔌 API Integration Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total: ${TOTAL}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Per Controller" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            go tool cover -func=api-coverage.out | grep '_controller\.go' | awk -F: '{file=$1} {printf "%-45s %s\n", file, $NF}' | sort -u >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            go tool cover -func=api-coverage.out | grep total >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  retag:
    name: Retag images as latest
    runs-on: ubuntu-latest
    needs: [api-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install crane
        run: |
          VERSION=0.20.2
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz crane
          chmod +x crane

      - name: Retag all images as latest
        run: |
          for img in domain-os unified-worker; do
            echo "Retagging geapex/${img}:${{ github.sha }} → :latest"
            ./crane tag "geapex/${img}:${{ github.sha }}" latest
          done
