name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug

jobs:
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --issues-exit-code=0

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup and Cache Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
        id: go

      - name: Start test Database server
        run: |
          chmod +x .github/scripts/setup-test-db.sh
          .github/scripts/setup-test-db.sh testdb

      - name: Run All Tests
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Run Agent Navigation Tests
        run: |
          echo "Running agent navigation feature tests..."
          go test ./internal/agent/service/... -v -run TestAddNavigationActions
          go test ./internal/agent/service/... -v -run TestNavigationActionStruct
          go test ./internal/agent/service/... -v -run TestChatResponse

      - name: Generate Agent Coverage Report
        run: |
          go test ./internal/agent/service/... -coverprofile=agent-coverage.out -covermode=atomic
          go tool cover -func=agent-coverage.out

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Run Registrar Tests
        run: |
          cd frontend
          echo "Running registrar management tests..."
          npm test -- registrars

      - name: Generate Frontend Coverage Report
        run: |
          cd frontend
          npm run test:coverage

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Determine platforms: multi-platform on main, amd64-only on PRs for speed
      - name: Set platforms
        id: platforms
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - name: Build and push AdminAPI
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: geapex/domain-os:${{ github.sha }}
          cache-from: type=registry,ref=geapex/domain-os:buildcache
          cache-to: type=registry,ref=geapex/domain-os:buildcache,mode=max

      - name: Build and push Domain Lifecycle Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/workers/domainLifecycle/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: geapex/domain-lifecycle-worker:${{ github.sha }}
          cache-from: type=registry,ref=geapex/domain-lifecycle-worker:buildcache
          cache-to: type=registry,ref=geapex/domain-lifecycle-worker:buildcache,mode=max

      - name: Build and push Sync Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/workers/sync/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: geapex/sync-worker:${{ github.sha }}
          cache-from: type=registry,ref=geapex/sync-worker:buildcache
          cache-to: type=registry,ref=geapex/sync-worker:buildcache,mode=max

  integrationtests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Run Integration Tests
        run: docker compose --profile essential -f docker-compose-ci.yml up --remove-orphans --abort-on-container-exit --exit-code-from test
        env:
          OPENEXCHANGERATES_APP_ID: ${{ secrets.OPENEXCHANGERATES_APP_ID }}
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
          POSTMAN_ENVIRONMENT_ID: ${{ vars.POSTMAN_ENVIRONMENT_ID }}
          DB_HOST: domain-os-db-1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: unittest
          DB_NAME: integrationtests
          API_PORT: 8080
          API_HOST: domain-os-admin-api-1
          API_NAME: ${{ secrets.API_NAME }}
          API_VERSION: ${{ secrets.API_VERSION }}
          # ADMIN_TOKEN is hardcoded in docker-compose-ci.yml (cicdtoken) to match Postman CI environment
          BRANCH: ${{ github.sha }}
          GIN_MODE: debug
          AUTO_MIGRATE: true
          NEW_RELIC_ENABLED: false
          PROMETHEUS_ENABLED: false
          RMQ_HOST: domain-os-msg-broker-1
          RMQ_PORT: ${{ secrets.RMQ_PORT }}
          RMQ_USER: ${{ secrets.RMQ_USER }}
          RMQ_PASS: ${{ secrets.RMQ_PASS }}
          EVENT_STREAM_TOPIC: ${{ secrets.EVENT_STREAM_TOPIC }}
          EVENT_STREAM_ENABLED: true

      - name: Cleanup Integration Test Containers
        if: always()
        run: docker compose --profile essential -f docker-compose-ci.yml down -v --remove-orphans 2>/dev/null || true

  retag:
    name: Retag images as latest
    runs-on: ubuntu-latest
    needs: integrationtests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install crane
        run: |
          VERSION=0.20.2
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz crane
          chmod +x crane

      - name: Retag all images as latest
        run: |
          for img in domain-os domain-lifecycle-worker sync-worker; do
            echo "Retagging geapex/${img}:${{ github.sha }} → :latest"
            ./crane tag "geapex/${img}:${{ github.sha }}" latest
          done
