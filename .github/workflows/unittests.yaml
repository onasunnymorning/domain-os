name: Unit Tests

on: 
  push

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup and Cache Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod
        id: go

      - name: Start test Database server
        run: |
          docker run --rm -d --name testdb -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 -e POSTGRES_PASSWORD=unittest -e POSTGRES_USER=postgres -p 5432:5432 postgres:16.1 -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
        id: testdb

      - name: Wait for database to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          sleep 5
          until docker exec testdb pg_isready -U postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Create test database
        run: |
          echo "Creating dos_unittests database..."
          docker exec testdb psql -U postgres -c "CREATE DATABASE dos_unittests;"

      - name: Run All Tests
        run: |
          go test -v ./...

      - name: Run Agent Navigation Tests
        run: |
          echo "Running agent navigation feature tests..."
          go test ./internal/agent/service/... -v -run TestAddNavigationActions
          go test ./internal/agent/service/... -v -run TestNavigationActionStruct
          go test ./internal/agent/service/... -v -run TestChatResponse

      - name: Generate Coverage Report
        run: |
          go test ./internal/agent/service/... -coverprofile=agent-coverage.out -covermode=atomic
          go tool cover -func=agent-coverage.out

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Run Registrar Tests
        run: |
          cd frontend
          echo "Running registrar management tests..."
          npm test -- registrars

      - name: Generate Frontend Coverage Report
        run: |
          cd frontend
          npm run test:coverage
