services:
# Database container
  db:
    image: postgres:16.1
    restart: "no"
    profiles: [essential, full]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 5
      start_period: 30s
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    command: >
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    # expose:
    #   - 5432
    ports:
      - 5432:5432
    networks:
      - dos
    volumes:
      - db:/var/lib/postgresql/data

# Core API container
  admin-api:
    image: "gprins/domain-os-api:${BRANCH}"
    restart: "no"
    profiles: [essential, full]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ping || exit"]
      interval: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GIN_MODE=${GIN_MODE}
      - AUTO_MIGRATE=${AUTO_MIGRATE}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED}
      # Same correction as docker-compose.yml: the code reads
      # NEW_RELIC_LICENSE_KEY, not NEWRELIC_LICENCE_KEY.
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - OPENEXCHANGERATES_APP_ID=${OPENEXCHANGERATES_APP_ID}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - API_PORT=${API_PORT}
      - API_HOST=${API_HOST}
      - API_NAME=${API_NAME}
      - ADMIN_TOKEN=cicdtoken  # Must match Postman CI environment 'token' variable
      - API_VERSION=${API_VERSION}
      # Temporal Client (CI: temporalite, no TLS)
      - TEMPORAL_HOST_PORT=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_CLIENT_KEY=
      - TEMPORAL_CLIENT_CERT=

    ports:
      - ${API_PORT:-8080}:${API_PORT:-8080}
    networks:
      - dos

  # Temporal stack (CI) - Postgres + Temporal Server
  temporal-postgres:
    image: postgres:14
    restart: "no"
    profiles: [essential, full]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 3s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    networks:
      - dos

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: "no"
    profiles: [essential, full]
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i) 7233"]
      interval: 10s
      retries: 5
      start_period: 60s
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - 7233:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks:
      - dos

  # Unified Worker - runs all Temporal workflows/activities in CI
  unified-worker:
    build:
      context: .
      dockerfile: ./cmd/workers/unified/Dockerfile
    image: gprins/domain-os-worker:${BRANCH}
    restart: "no"
    profiles: [essential, full]
    depends_on:
      admin-api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_HOST_PORT=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_CLIENT_KEY=
      - TEMPORAL_CLIENT_CERT=
      - API_HOST=admin-api
      - API_PORT=${API_PORT}
      - ADMIN_TOKEN=cicdtoken  # Must match admin-api token above
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    networks:
      - dos
# TEST container from wich we will be running integration tests based on a postman collection
  test:
    image: postman/newman:6-alpine
    profiles: [essential, full]
    command:
      run "https://api.getpostman.com/collections/"${POSTMAN_COLLECTION_ID}"?apikey="${POSTMAN_API_KEY} -e "https://api.getpostman.com/environments/"${POSTMAN_ENVIRONMENT_ID}"?apikey="${POSTMAN_API_KEY}
    environment:
      - apikey=${POSTMAN_API_KEY}
      - collection=${POSTMAN_COLLECTION_ID}
      - environment=${POSTMAN_ENVIRONMENT_ID}
    depends_on:
      admin-api:
        condition: service_healthy
      db:
        condition: service_healthy
      unified-worker:
        condition: service_started
    networks:
      - dos

networks:
  dos:
    driver: bridge

volumes:
  db:
    driver: local
  temporal_pgdata:
    driver: local
