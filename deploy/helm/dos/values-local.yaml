# Local development overrides for domain-os

api:
  replicaCount: 1
  image: geapex/domain-os
  tag: latest
  imagePullPolicy: IfNotPresent

unifiedworker:
  replicaCount: 1
  image: geapex/unified-worker
  tag: latest
  imagePullPolicy: IfNotPresent

service:
  port: 8080

# Environment Configuration
gin:
  GIN_MODE: debug

newrelic:
  enabled: "false"

db:
  DB_HOST: "host.docker.internal" # Assume local postgres or change to 'postgres' service name
  DB_PORT: "5432"
  DB_NAME: "domain-os"
  AUTO_MIGRATE: "true"

app:
  API_PORT: "8080"
  API_HOST: "0.0.0.0"
  API_VERSION: "v1"
  API_NAME: "domain-os"

temporal:
  TEMPORAL_HOST_PORT: "temporal:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_API_KEY: ""

prometheus:
  enabled: "false"
