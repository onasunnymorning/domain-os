global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

# Alert rules: docs/epp/RUNBOOK.md says what each EPP alert means.
rule_files:
  - /etc/prometheus/rules/*.yml

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  # Collect metrics from domain-os API using the standard prometheus metrics endpoint
  - job_name: 'domain-os-api'
    scrape_interval: 10s
    metrics_path: '/metrics'  # Ensure your Gin application uses this route
    static_configs:
      - targets: ['admin-api:8080']

  # EPP server ops port: sessions, commands, handshakes, certificate expiry
  - job_name: 'epp-server'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['epp-server:9700']

  # RDAP server ops port: requests, latency against the SLA, limits, redactions
  - job_name: 'rdap-server'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rdap-server:9701']
