# Render Blueprint — AlpacaNames TEST environment
# https://docs.render.com/blueprint-spec
#
# Usage:
#   1. Push this file to the repo
#   2. In Render dashboard → Blueprints → New Blueprint Instance
#   3. Connect this repo, Render will read this file
#   4. Set the secrets (DATABASE_URL, ADMIN_TOKEN) in the Render dashboard
#
# Region: Oregon (us-west-2) — match your Neon project region.

services:
  # ── Go API ──────────────────────────────────────────────
  - type: web
    name: alp-api-test
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /ping
    envVars:
      # Database — set manually from Neon connection string
      - key: DATABASE_URL
        sync: false
      # API server
      - key: API_PORT
        value: "8080"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_NAME
        value: "AlpacaNames TEST API"
      - key: API_VERSION
        value: "0.1.0-test"
      - key: GIN_MODE
        value: "release"
      # DB migration on startup
      - key: AUTO_MIGRATE
        value: "true"
      # CORS — must match the frontend URL
      - key: CORS_ALLOWED_ORIGINS
        value: "https://alp-ui-test.onrender.com"
      # Auth — disabled for initial TEST
      - key: AUTH0_ENABLED
        value: "false"
      - key: ADMIN_TOKEN
        sync: false
      # Observability — disabled for TEST
      - key: NEW_RELIC_ENABLED
        value: "false"
      - key: PROMETHEUS_ENABLED
        value: "false"
      # Temporal Cloud (for starting workflows)
      - key: TEMPORAL_HOST_PORT
        sync: false
      - key: TEMPORAL_NAMESPACE
        value: "alp-test.fclnj"
      - key: TEMPORAL_API_KEY
        sync: false
      - key: TEMPORAL_QUEUE
        value: "object-lifecycle"

  # ── Next.js Frontend ────────────────────────────────────
  - type: web
    name: alp-ui-test
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    plan: starter
    envVars:
      # API URL — baked at build time (NEXT_PUBLIC_* are inlined by Next.js)
      - key: NEXT_PUBLIC_API_URL
        value: "https://alp-api-test.onrender.com"
      # Auth — disabled for initial TEST
      - key: NEXT_PUBLIC_AUTH0_ENABLED
        value: "false"
      # Version
      - key: NEXT_PUBLIC_APP_VERSION
        value: "0.1.0-test"
      # API auth token — baked at build time into client JS
      - key: NEXT_PUBLIC_API_TOKEN
        sync: false
      # External tool URLs — baked at build time
      - key: NEXT_PUBLIC_TEMPORAL_UI_URL
        value: "https://cloud.temporal.io/namespaces/alp-test.fclnj/workflows"
      - key: NEXT_PUBLIC_GRAFANA_URL
        value: ""

  # ── Unified Worker (Temporal) ──────────────────────────
  - type: worker
    name: alp-worker-test
    runtime: docker
    dockerfilePath: ./cmd/workers/unified/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      # API connection
      - key: API_URL
        value: "https://alp-api-test.onrender.com"
      # Auth0 M2M (worker → API)
      - key: AUTH0_ENABLED
        value: "true"
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_WORKER_CLIENT_ID
        sync: false
      - key: AUTH0_WORKER_CLIENT_SECRET
        sync: false
      # Temporal Cloud
      - key: TEMPORAL_HOST_PORT
        sync: false
      - key: TEMPORAL_NAMESPACE
        value: "alp-test.fclnj"
      - key: TEMPORAL_API_KEY
        sync: false
      # Direct DB (Neon)
      - key: DATABASE_URL
        sync: false
      # S3 (Backblaze B2)
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_USE_SSL
        value: "true"
      - key: ESCROW_BUCKET
        sync: false
