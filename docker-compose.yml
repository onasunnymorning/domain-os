services:
  # Database container
  db:
    image: postgres:16.1
    restart: always
    profiles: [ essential, full ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 3s
      retries: 5
      start_period: 30s
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    command: >
      -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

    # expose:
    #   - 5432
    ports:
      - 5432:5432
      - 55432:55432
    networks:
      - dos
    volumes:
      - db:/var/lib/postgresql/data

  # RabbitMQ Broker container
  msg-broker:
    image: rabbitmq:3.13
    restart: unless-stopped
    profiles: [ full ]
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmqctl node_health_check" ]
      interval: 15s
      retries: 3
    ports:
      - 5552:5552
      - 5672:5672
      - 15672:15672
      - 15692:15692
    networks:
      - dos
    environment:
      - RABBITMQ_DEFAULT_USER=${RMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RMQ_PASS}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq_stream
      - RABBITMQ_ENABLED_PLUGINS_FILE=/etc/rabbitmq/enabled_plugins
    volumes:
      - ./.rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins

  # Redis container for session management and rate limiting
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [ essential, full ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
      start_period: 10s
    ports:
      - 6379:6379
    networks:
      - dos
    command: >
      redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  # EPP Server container
  epp-server:
    build:
      context: .
      dockerfile: Dockerfile.epp
    image: geapex/epp-server:${BRANCH:-latest}
    restart: unless-stopped
    profiles: [ essential, full ]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "700" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 700:700
    networks:
      - dos
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    develop:
      watch:
        - action: rebuild
          path: ./cmd/epp
        - action: rebuild
          path: ./internal/infrastructure/epp

  # Prometheus container
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    profiles: [ full ]
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    ports:
      - 9090:9090
    networks:
      - dos
    restart: unless-stopped
    depends_on:
      msg-broker:
        condition: service_healthy
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus

  # Grafana container
  grafana:
    image: grafana/grafana
    profiles: [ full ]
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - dos
    depends_on:
      msg-broker:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards-provisioning:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  # Core API container
  admin-api:
    build: .
    image: "geapex/domain-os:${BRANCH}"
    restart: always
    profiles: [ essential, full ]
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ping || exit 1" ]
      interval: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      # msg-broker:
      #   condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./cmd/api
    environment:
      - GIN_MODE=${GIN_MODE}
      - AUTO_MIGRATE=${AUTO_MIGRATE}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED}
      - NEWRELIC_LICENCE_KEY=${NEWRELIC_LICENCE_KEY}
      - NEWRELIC_USER_KEY=${NEWRELIC_USER_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENEXCHANGERATES_APP_ID=${OPENEXCHANGERATES_APP_ID}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - API_PORT=${API_PORT}
      - API_HOST=${API_HOST}
      - API_NAME=${API_NAME}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-devtoken}
      - API_VERSION=${API_VERSION}
      - AUTH0_ENABLED=${AUTH0_ENABLED:-false}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - RMQ_HOST=${RMQ_HOST}
      - RMQ_PORT=${RMQ_PORT}
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
      - EVENT_STREAM_TOPIC=${EVENT_STREAM_TOPIC}
      - EVENT_STREAM_ENABLED=${EVENT_STREAM_ENABLED}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED}
      # Temporal Client (dev: temporalite, no TLS)
      - TMPIO_HOST_PORT=temporal:7233
      - TMPIO_NAME_SPACE=default
      - TMPIO_QUEUE=domain-lifecycle
      - TMPIO_KEY=
      - TMPIO_CERT=
      # S3/MinIO settings for escrow
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT="http://localhost:9000"
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - ESCROW_BUCKET=escrow
      - TMPIO_UI_URL=http://localhost:8081
    ports:
      - ${API_PORT:-8080}:${API_PORT:-8080}
    networks:
      - dos

  # Admin Init (One-off task to sync registrars on startup)
  admin-init:
    image: "geapex/domain-os:${BRANCH}"
    restart: "no" # Run once and stop
    profiles: [ essential, full ]
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      admin-api:
        condition: service_healthy # Wait for migrations / full startup 
    command: [ "/ryAdminAPI", "init-registrars" ]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - TMPIO_HOST_PORT=temporal:7233
      - TMPIO_NAME_SPACE=default
      - TMPIO_QUEUE=domain-lifecycle
      - TMPIO_KEY=
      - TMPIO_CERT=
      - ADMIN_TOKEN=${ADMIN_TOKEN:-devtoken}
      # Minimal envs needed for DB/Temporal
    networks:
      - dos

  # Temporal stack (dev) - Postgres + Temporal Server + UI
  temporal-postgres:
    image: postgres:14
    restart: unless-stopped
    profiles: [ essential, full ]
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    networks:
      - dos

  temporal:
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    profiles: [ essential, full ]
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - 7233:7233
    healthcheck:
      test: [ "CMD-SHELL", "nc -z $(hostname -i) 7233" ]
      interval: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - temporal-postgres
    networks:
      - dos

  temporal-ui:
    image: temporalio/ui:latest
    restart: unless-stopped
    profiles: [ essential, full ]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - 8081:8080 # UI on host 8081 to avoid conflict with admin-api 8080
    depends_on:
      - temporal
    networks:
      - dos

  # Domain Lifecycle Worker - runs Temporal workflows/activities
  domain-lifecycle-worker:
    build:
      context: .
      dockerfile: ./cmd/workers/domainLifecycle/Dockerfile
    image: geapex/domain-lifecycle-worker:${BRANCH}
    restart: unless-stopped
    profiles: [ essential, full ]
    depends_on:
      admin-api:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      - TMPIO_HOST_PORT=temporal:7233
      - TMPIO_NAME_SPACE=default
      - TMPIO_QUEUE=domain-lifecycle
      - TMPIO_KEY=
      - TMPIO_CERT=
      - API_HOST=admin-api
      - API_PORT=${API_PORT}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-devtoken}
      - AUTH0_ENABLED=${AUTH0_ENABLED:-false}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_WORKER_CLIENT_ID=${AUTH0_WORKER_CLIENT_ID}
      - AUTH0_WORKER_CLIENT_SECRET=${AUTH0_WORKER_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    networks:
      - dos

  # Escrow Import Worker - runs escrow import workflow
  escrow-import-worker:
    build:
      context: .
      dockerfile: ./cmd/workers/escrowImport/Dockerfile
    image: geapex/escrow-import-worker:${BRANCH}
    restart: unless-stopped
    profiles: [ essential, full ]
    depends_on:
      admin-api:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      - TMPIO_HOST_PORT=temporal:7233
      - TMPIO_NAME_SPACE=default
      - TMPIO_QUEUE=domain-lifecycle
      - ESCROW_QUEUE=escrow-import
      - TMPIO_KEY=
      - TMPIO_CERT=
      # S3/MinIO settings for escrow
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - ESCROW_BUCKET=escrow
      # Postgres settings (match admin-api)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - API_HOST=admin-api
      - API_PORT=${API_PORT}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-devtoken}
      - AUTH0_ENABLED=${AUTH0_ENABLED:-false}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_WORKER_CLIENT_ID=${AUTH0_WORKER_CLIENT_ID}
      - AUTH0_WORKER_CLIENT_SECRET=${AUTH0_WORKER_CLIENT_SECRET}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    networks:
      - dos

  # MinIO (S3-compatible)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: [ essential, full ]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - minio_data:/data
    networks:
      - dos

  # MinIO client to create the bucket
  minio-setup:
    image: minio/mc:latest
    restart: "no"
    profiles: [ essential, full ]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MC_HOST_minio=http://minioadmin:minioadmin@minio:9000
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "mc mb -p minio/escrow || true; mc anonymous set download minio/escrow || true"
    networks:
      - dos

  # Whois container
  whois:
    image: "geapex/whois:${BRANCH}"
    restart: always
    profiles: [ full ]
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./cmd/whois
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    ports:
      - 43:43
    networks:
      - dos
  # Frontend Admin Container
  # admin-frontend:
  #   image: "admin-dash:delete"
  #   restart: always
  #   profiles: [full]
  #   ports:
  #     - 3000:3000
  #   depends_on:
  #     admin-api:
  #       condition: service_healthy
  #   environment:
  #     - AUTH_TRUST_HOST="true"
  #     - AUTH_SECRET=80b9fe9f59f563481762556f5d4b2957
  #     - API_HOST=http://domain-os-admin-api-1
  #     - API_PORT=8080
  #   networks:
  #     - dos


  # Metabase container
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    profiles: [ essential, full ]
    restart: unless-stopped
    ports:
      - 3001:3000
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - dos

  # Metabase Initializer (Sidecar)
  metabase-init:
    image: python:3.9-slim
    profiles: [ essential, full ]
    depends_on:
      - metabase
    volumes:
      - ./scripts/metabase:/app
    working_dir: /app
    environment:
      - METABASE_URL=http://metabase:3000
      - MB_ADMIN_EMAIL=admin@domain-os.local
      - MB_ADMIN_PASS=admin1234
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    command: >
      sh -c "pip install requests && python metabase_control.py"
    networks:
      - dos

networks:
  dos:
    driver: bridge

volumes:
  db:
    driver: local
  prom_data:
    driver: local
  redis_data:
    driver: local
  temporal_pgdata:
    driver: local
  metabase_data:
    driver: local
  minio_data:
    driver: local
