version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - gosec

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

  exclusions:
    paths:
      - vendor
      - testdata
